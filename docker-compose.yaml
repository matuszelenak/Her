services:
  nginx:
    container_name: her-nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
      ui:
        condition: service_started

  database:
    container_name: her-database
    image: postgres:14.3
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - .env

  server:
    container_name: her-server
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - WHISPER_API_URL=${WHISPER_API_URL}
      - ASSISTANT_API_URL=${ASSISTANT_API_URL}
      - KOKORO_API_URL=${KOKORO_API_URL}
      - ORPHEUS_API_URL=${ORPHEUS_API_URL}
      - CHATTERBOX_API_URL=${CHATTERBOX_API_URL}
    build:
      context: ./server
      dockerfile: Dockerfile
    command:  --reload --timeout-graceful-shutdown 0
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: rebuild
          path: server/requirements.txt
        - action: sync
          path: server
          target: /app
    volumes:
      - ./tts_output:/tts_output
      - ./voices:/voices

  assistant:
    container_name: her-assistant
    build:
      context: ./assistant
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_URL=${OPENAI_API_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
    ports:
      - "8001:8001"
    entrypoint: uv run uvicorn server:app --host 0.0.0.0 --port 8001 --reload --timeout-graceful-shutdown 0
    develop:
      watch:
        - action: rebuild
          path: assistant/requirements.txt
        - action: sync
          path: assistant
          target: /app

  ui:
    container_name: her-ui
    build:
      context: svelte-ui
      dockerfile: dev.Dockerfile
    depends_on:
      - server
    ports:
      - "5000:5000"
    develop:
      watch:
        - action: rebuild
          path: ./ui/package.json
        - action: sync
          path: ./svelte-ui
          target: /app
          ignore:
            - node_modules/


volumes:
  postgres-data:
